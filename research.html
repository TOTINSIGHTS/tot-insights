<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research - TOT Insights</title>
<meta name="description" content="Research outputs from TOT Insights - analytical briefings, reports, journal articles, dashboards, and primary source collections on Russian-occupied Ukrainian territories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="navigation.css">
<link rel="stylesheet" href="assets/css/main.css">
<style>
:root {
  --navy:#111d30;--steel:#B5923A;--gold:#B5923A;--gold-lt:#E8D5A0;--cream:#0D1624;--paper:#0D1624;
  --text:rgba(232,228,220,0.90);--muted:rgba(232,228,220,0.55);--border:rgba(255,255,255,0.07);
  --theme-econ:#0D4A7A;--theme-soc:#1A5C35;--theme-gov:#3D6678;--theme-edu:#7A5C0D;--theme-prop:#6B2D0D;
  --theme-civ:#1A5C35;--theme-idr:#6B2D8A;--theme-eml:#7A5C0D;--theme-crs:#7A1C28;--theme-inf:#6B2D0D;--theme-acc:#0D5C4A;
  --bg-econ:rgba(13,74,122,0.25);--bg-soc:rgba(26,92,53,0.25);--bg-gov:rgba(61,102,120,0.25);--bg-edu:rgba(122,92,13,0.25);--bg-prop:rgba(107,45,13,0.25);
  --bg-civ:rgba(26,92,53,0.25);--bg-idr:rgba(107,45,138,0.25);--bg-eml:rgba(122,92,13,0.25);--bg-crs:rgba(122,28,40,0.25);--bg-inf:rgba(107,45,13,0.25);--bg-acc:rgba(13,92,74,0.25);
  --font-serif:'EB Garamond',Georgia,serif;--font-sans:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;
}

body{font-family:var(--font-sans);background:#111d30;color:rgba(232,228,220,0.90);font-size:15px;line-height:1.6;}

.browse{padding:40px 40px 80px;padding-top:40px;}
.browse-inner{max-width:1200px;margin:0 auto;}
.browse-search-wrap{margin-bottom:20px;}
.browse-search{width:100%;font-family:var(--font-sans);font-size:14px;color:rgba(232,228,220,0.90);background:#0D1624;border:1px solid rgba(255,255,255,0.08);border-radius:2px;padding:8px 14px;outline:none;transition:border-color 0.12s;}
.browse-search:focus{border-color:rgba(181,146,58,0.60);}
.browse-search::placeholder{color:rgba(232,228,220,0.32);}
.filter-block{margin-bottom:20px;}
.filter-row-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(232,228,220,0.75);margin-bottom:8px;}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;}

.filter-btn{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.filter-btn:hover{background:rgba(201,168,76,0.3);border-color:rgba(201,168,76,0.4);color:#c9a84c;}
.filter-btn.active,.filter-btn.theme-econ.active,.filter-btn.theme-soc.active,.filter-btn.theme-gov.active,.filter-btn.theme-edu.active,.filter-btn.theme-prop.active,.filter-btn.theme-civ.active,.filter-btn.theme-idr.active,.filter-btn.theme-eml.active,.filter-btn.theme-crs.active,.filter-btn.theme-inf.active,.filter-btn.theme-acc.active{background:#c9a84c;border:1px solid #c9a84c;color:#111d30;font-weight:700;}
.results-count{font-family:var(--font-mono);font-size:11px;color:rgba(232,228,220,0.75);margin-bottom:14px;letter-spacing:0.05em;}
.results-count span{color:rgba(181,146,58,0.85);font-weight:500;}
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(232,228,220,0.75);margin-bottom:18px;display:flex;align-items:center;gap:10px;}

.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:stretch;}
@media(max-width:1000px){.doc-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.doc-grid{grid-template-columns:1fr;}}
.doc-card{background:#ffffff;border:1px solid rgba(26,26,46,0.12);border-left:3px solid #c9a84c;border-radius:3px;padding:16px 18px 14px;cursor:pointer;transition:all 0.2s ease;display:flex;flex-direction:column;height:420px;overflow:hidden;}
.doc-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.15);transform:translateY(-2px);}
.doc-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:9px;gap:8px;}
.doc-theme-pill{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap;flex-shrink:0;background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.doc-id{font-family:var(--font-mono);font-size:9px;color:#8a6f2e;letter-spacing:0.08em;}
.doc-title{font-family:var(--font-serif);font-size:20px;font-weight:600;color:#1a1a2e;line-height:1.35;margin-bottom:7px;}
.doc-desc{font-size:13px;color:#3a3a4a;line-height:1.6;flex:1;margin-bottom:12px;}
.doc-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:9px;border-top:1px solid rgba(26,26,46,0.10);}
.doc-format{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#3a3a4a;}
.doc-arrow{font-size:14px;color:rgba(139,111,46,0.60);transition:color 0.12s,transform 0.12s;}
.doc-date{font-family:var(--font-mono);font-size:9px;color:rgba(58,58,74,0.60);letter-spacing:0.08em;margin-bottom:5px;}
.doc-card:hover .doc-arrow{color:rgba(181,146,58,0.80);transform:translateX(3px);}
.t-econ{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-soc{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-gov{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-edu{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-prop{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-civ{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-idr{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-eml{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-crs{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-inf{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.t-acc{background:rgba(201,168,76,0.15);color:#c9a84c;border:1px solid rgba(201,168,76,0.4);}
.no-results{display:none;grid-column:1/-1;padding:48px 0;text-align:center;color:rgba(232,228,220,0.75);font-size:14px;}
.no-results.visible{display:block;}
.browse-show-more-wrap{margin-top:20px;text-align:center;}
.browse-show-more{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:rgba(232,228,220,0.75);background:none;border:1px solid rgba(255,255,255,0.12);border-radius:2px;padding:9px 24px;cursor:pointer;transition:border-color 0.12s,color 0.12s;}
.browse-show-more:hover{border-color:rgba(181,146,58,0.60);color:rgba(181,146,58,0.85);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,18,32,0.72);z-index:200;align-items:center;justify-content:center;padding:24px;}
.modal-overlay.open{display:flex;}
.modal{background:#111d30;border-radius:3px;max-width:660px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 28px 80px rgba(0,0,0,0.35);}
.modal-header{background:#0D1624;padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:sticky;top:0;border-bottom:2px solid #E8B84B;}
.modal-header-text{flex:1;}
.modal-id{font-family:var(--font-mono);font-size:10px;color:#E8B84B;letter-spacing:0.12em;margin-bottom:6px;opacity:0.85;}
.modal-title{font-family:var(--font-serif);font-size:17px;font-weight:700;color:#fff;line-height:1.3;}
.modal-close{background:none;border:none;color:rgba(255,255,255,0.45);font-size:22px;cursor:pointer;line-height:1;padding:0;flex-shrink:0;transition:color 0.12s;}
.modal-close:hover{color:#fff;}
.modal-body{padding:22px 24px 24px;}
.modal-tags{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.modal-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 9px;border-radius:2px;}
.modal-section-label{font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(232,228,220,0.75);margin-bottom:6px;margin-top:16px;}
.modal-region-label{font-family:var(--font-mono);font-size:9px;color:rgba(232,228,220,0.75);letter-spacing:0.08em;margin-bottom:14px;}
.modal-descriptor{font-size:13px;font-style:italic;color:rgba(181,146,58,0.80);line-height:1.65;border-left:3px solid #FBE9A8;padding-left:14px;}
.modal-summary{font-size:13px;line-height:1.75;color:rgba(232,228,220,0.88);}
.modal-file{font-family:var(--font-mono);font-size:11px;color:rgba(232,228,220,0.75);background:#0D1624;padding:8px 12px;border-radius:2px;border:1px solid rgba(255,255,255,0.10);}
.modal-context-note{background:#0D1624;border:1px solid rgba(255,255,255,0.07);border-left:3px solid #E8B84B;border-radius:2px;padding:14px 16px;margin-top:6px;}
.modal-context-note p{font-size:12.5px;line-height:1.78;color:rgba(232,228,220,0.88);margin-bottom:10px;}
.modal-context-note p:last-child{margin-bottom:0;}
.modal-actions{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.07);display:flex;gap:10px;flex-wrap:wrap;}
.btn-gdocs{display:inline-flex;align-items:center;gap:8px;background:#B5923A;color:#fff;font-family:var(--font-sans);font-size:12px;font-weight:500;padding:9px 18px;border-radius:2px;text-decoration:none;transition:background 0.15s;cursor:pointer;border:none;}
.btn-gdocs:hover{background:#9a7c32;}
.viewer-overlay{display:none;position:fixed;inset:0;z-index:300;background:#0D1624;flex-direction:column;}
.viewer-overlay.open{display:flex;}
.viewer-header{background:#0D1624;border-bottom:2px solid #E8B84B;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px;}
.viewer-header-left{display:flex;align-items:center;gap:16px;min-width:0;}
.viewer-back{background:none;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.7);font-family:var(--font-mono);font-size:11px;letter-spacing:0.05em;padding:5px 12px;cursor:pointer;border-radius:2px;white-space:nowrap;flex-shrink:0;transition:color 0.12s,border-color 0.12s;}
.viewer-back:hover{color:#fff;border-color:rgba(255,255,255,0.6);}
.viewer-title{font-family:var(--font-serif);font-size:13px;color:rgba(255,255,255,0.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewer-close{background:none;border:none;color:rgba(255,255,255,0.4);font-size:22px;cursor:pointer;line-height:1;padding:0;flex-shrink:0;transition:color 0.12s;}
.viewer-close:hover{color:#fff;}
#viewer-iframe{flex:1;width:100%;border:none;background:#fff;}
@media(max-width:700px){.browse{padding:28px 20px 60px;}.page-hero{padding:24px 20px 20px;}}

</style>
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-eyebrow">TOT Insights</div>
    <h1 class="page-title">Research Outputs</h1>
  </div>
</div>

<section class="browse">
  <div class="browse-inner">
    <div class="section-label">All research outputs</div>
    <div class="browse-search-wrap">
      <input type="search" class="browse-search" id="browse-search" placeholder="Search titles and summaries…" autocomplete="off">
    </div>
    <div class="filter-block">
      <div class="filter-row-label">Theme</div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="theme" data-value="all">All themes</button>
        <button class="filter-btn theme-gov" data-filter="theme" data-value="Governance">Governance</button>
        <button class="filter-btn theme-econ" data-filter="theme" data-value="Economics">Economics</button>
        <button class="filter-btn theme-civ" data-filter="theme" data-value="Civilian Life">Civilian Life</button>
        <button class="filter-btn theme-idr" data-filter="theme" data-value="Identity, Culture and Religion">Identity, Culture and Religion</button>
        <button class="filter-btn theme-eml" data-filter="theme" data-value="Education and Militarisation">Education and Militarisation</button>
        <button class="filter-btn theme-crs" data-filter="theme" data-value="Coercion, Resistance and Security">Coercion, Resistance and Security</button>
        <button class="filter-btn theme-inf" data-filter="theme" data-value="Information Space">Information Space</button>
        <button class="filter-btn theme-acc" data-filter="theme" data-value="Accountability and Legal">Accountability and Legal</button>
      </div>
    </div>
    <div class="filter-block">
      <div class="filter-row-label">Format</div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="format" data-value="all">All formats</button>
        <button class="filter-btn" data-filter="format" data-value="Briefing">Briefings</button>
        <button class="filter-btn" data-filter="format" data-value="Report">Reports</button>
        <button class="filter-btn" data-filter="format" data-value="Journal Article">Journal Articles</button>
        <button class="filter-btn" data-filter="format" data-value="Dashboard">Dashboards</button>
        <button class="filter-btn" data-filter="format" data-value="Visual">Visuals</button>
        <button class="filter-btn" data-filter="format" data-value="Primary Sources">Primary Sources</button>
      </div>
    </div>
    <div class="results-count"><span id="count-num">48</span> outputs</div>
    <div id="browse-segments">
      <div class="doc-grid" id="doc-grid-all"></div>
      <div class="no-results" id="no-results">No outputs match the selected filters.</div>
    </div>
    <div class="browse-show-more-wrap" id="browse-show-more-wrap" style="display:none;">
      <button class="browse-show-more" id="browse-show-more-btn" onclick="expandBrowse()"></button>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-header-text">
        <div class="modal-id" id="modal-id"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-tags" id="modal-tags"></div>
      <div class="modal-region-label" id="modal-region-label"></div>
      <div class="modal-section-label">Platform descriptor</div>
      <div class="modal-descriptor" id="modal-descriptor"></div>
      <div class="modal-section-label">Summary</div>
      <div class="modal-summary" id="modal-summary"></div>
      <div id="modal-context-wrap"></div>
      <div class="modal-section-label">Source file</div>
      <div class="modal-file" id="modal-file"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</div>

<div class="viewer-overlay" id="viewer-overlay">
  <div class="viewer-header">
    <div class="viewer-header-left">
      <button class="viewer-back" onclick="closeViewer()">← Back to platform</button>
      <span class="viewer-title" id="viewer-title"></span>
    </div>
    <button class="viewer-close" onclick="closeViewer()">×</button>
  </div>
  <iframe id="viewer-iframe" src="" frameborder="0" allowfullscreen></iframe>
</div>

<script src="data/documents.js"></script>
<script>
const BROWSE_DEFAULT=100;
let activeTheme="all",activeFormat="all",browseSearch="",browseExpanded=false;

function buildCards(){
  const SEG=[
    {id:'doc-grid-all',s:0,e:DOCS.length}
  ];
  SEG.forEach(seg=>{
    const grid=document.getElementById(seg.id);
    if(!grid)return;
    DOCS.slice(seg.s,seg.e).forEach(doc=>{
      const card=document.createElement('div');
      card.className='doc-card';
      card.dataset.docId=doc.id;
      card.onclick=()=>openModal(doc.id);
      const th=Array.isArray(doc.theme)?doc.theme:[doc.theme];
      const pills=th.map(t=>`<span class="doc-theme-pill ${THEME_CLASS[t]||''}">${t}</span>`).join('');
      card.innerHTML=`<div class="doc-card-top"><div style="display:flex;gap:4px;flex-wrap:wrap;flex:1;">${pills}</div><span class="doc-id">${doc.id}</span></div>${doc.date?`<div class="doc-date">${doc.date}</div>`:""}<div class="doc-title">${doc.title}</div><div class="doc-desc">${doc.desc}</div><div class="doc-card-footer"><span class="doc-format">${doc.format}</span><span class="doc-arrow">&rarr;</span></div>${doc.doi?('<div style="font-family:\'IBM Plex Mono\',monospace;font-size:0.65rem;margin-top:6px;padding-top:6px;border-top:1px solid rgba(26,26,46,0.10);">'+(doc.doi2?('<a href="'+doc.doi+'" target="_blank" rel="noopener noreferrer" style="color:rgba(181,146,58,0.80);text-decoration:none;margin-right:8px;">DOI &#8599;</a> <a href="'+doc.doi2+'" target="_blank" rel="noopener noreferrer" style="color:rgba(181,146,58,0.80);text-decoration:none;">DOI &#8599;</a>'):('<a href="'+doc.doi+'" target="_blank" rel="noopener noreferrer" style="color:rgba(181,146,58,0.80);text-decoration:none;">'+doc.doi.replace('https://doi.org/','')+' &#8599;</a>'))+'</div>'):''}${doc.vizFile?'<div style="font-family:\'IBM Plex Mono\',monospace;font-size:0.65rem;margin-top:3px;"><a href="'+doc.vizFile+'" onclick="event.stopPropagation()" style="color:rgba(181,146,58,0.80);text-decoration:none;">'+(doc.vizLabel||'Interactive visualisation')+' &#8594;</a></div>':''}${doc.vizFile2?'<div style="font-family:\'IBM Plex Mono\',monospace;font-size:0.65rem;margin-top:2px;"><a href="'+doc.vizFile2+'" onclick="event.stopPropagation()" style="color:rgba(181,146,58,0.80);text-decoration:none;">'+(doc.vizLabel2||'Interactive visualisation 2')+' &#8594;</a></div>':''}${doc.datasetFile?'<div style="font-family:\'IBM Plex Mono\',monospace;font-size:0.65rem;margin-top:2px;"><a href="'+doc.datasetFile+'" onclick="event.stopPropagation();event.preventDefault();openViewer(this.href,\'Underlying dataset\');return false;" style="color:rgba(181,146,58,0.80);text-decoration:none;">Underlying dataset &#8594;</a></div>':''}`;
      grid.appendChild(card);
    });
  });
}
function applyFilters(){
  const q=browseSearch.toLowerCase();
  const filtersActive=activeTheme!=='all'||activeFormat!=='all';
  let count=0;
  document.querySelectorAll('.doc-card').forEach(card=>{
    const id=card.dataset.docId;
    const doc=DOCS.find(d=>d.id===id);
    if(!doc)return;
    let show=true;
    if(activeTheme!=="all"&&(Array.isArray(doc.theme)?!doc.theme.includes(activeTheme):doc.theme!==activeTheme))show=false;
    if(activeFormat!=='all'){const df=doc.format.toLowerCase().trim(),af=activeFormat.toLowerCase().trim();if(df!==af&&df+'s'!==af&&df!==af+'s')show=false;}
    if(q&&!(doc.title.toLowerCase().includes(q)||(doc.summary&&doc.summary.toLowerCase().includes(q))))show=false;
    card.style.display=show?'':'none';
    if(show)count++;
  });
  document.getElementById('count-num').textContent=count;
  document.getElementById('no-results').classList.toggle('visible',count===0);
}

document.getElementById('browse-search').addEventListener('input',function(){
  browseSearch=this.value.trim();applyFilters();
});
function expandBrowse(){applyFilters();}
document.querySelectorAll('[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const type=btn.dataset.filter,val=btn.dataset.value;
    if(type==='theme'){activeTheme=val;document.querySelectorAll('[data-filter="theme"]').forEach(b=>b.classList.remove('active'));}
    else{activeFormat=val;document.querySelectorAll('[data-filter="format"]').forEach(b=>b.classList.remove('active'));}
    btn.classList.add('active');applyFilters();
  });
});

function getPreviewUrl(gdocsUrl){
  if(!gdocsUrl||gdocsUrl==='#')return null;
  const docMatch=gdocsUrl.match(/docs\.google\.com\/document\/d\/([^/?]+)/);
  if(docMatch)return`https://docs.google.com/document/d/${docMatch[1]}/preview`;
  const sheetMatch=gdocsUrl.match(/docs\.google\.com\/spreadsheets\/d\/([^/?]+)/);
  if(sheetMatch)return`https://docs.google.com/spreadsheets/d/${sheetMatch[1]}/preview`;
  return null;
}

function openModal(id){
  const doc=DOCS.find(d=>d.id===id);if(!doc)return;
  if(doc.externalUrl){window.location.href=doc.externalUrl;return;}
  if(doc.dashboardFile){openViewer(doc.dashboardFile,doc.title);return;}
  if(doc.format==='Briefing'&&doc.briefingFile){openViewer(doc.briefingFile,doc.title);return;}
  if(doc.format==='Data'&&doc.gdocs){const previewUrl=getPreviewUrl(doc.gdocs);if(previewUrl){openViewer(previewUrl,doc.title);return;}}
  document.getElementById('modal-id').textContent=doc.id;
  document.getElementById('modal-title').textContent=doc.title;
  document.getElementById('modal-descriptor').textContent=doc.descriptor;
  document.getElementById('modal-summary').textContent=doc.summary;
  document.getElementById('modal-file').textContent=doc.file;
  const mth=Array.isArray(doc.theme)?doc.theme:[doc.theme];
  document.getElementById('modal-tags').innerHTML=mth.map(t=>`<span class="modal-tag ${THEME_CLASS[t]||''}">${t}</span>`).join('')+`<span class="modal-tag" style="background:#0D1624;color:rgba(232,228,220,0.75);border:1px solid rgba(255,255,255,0.08)">${doc.format}</span>`;
  const ctxWrap=document.getElementById('modal-context-wrap');
  const note=CONTEXT_NOTES[doc.id];
  ctxWrap.innerHTML=note?`<div class="modal-section-label">Contextualising note</div><div class="modal-context-note">${note.map(p=>`<p>${p}</p>`).join('')}</div>`:'';
  const gdocsUrl=doc.gdocs||'#';
  const isGoogleUrl=gdocsUrl&&gdocsUrl.includes('google.');
  const isExternalUrl=gdocsUrl&&(gdocsUrl.startsWith('http://')||gdocsUrl.startsWith('https://'));
  const isLocalFile=gdocsUrl&&gdocsUrl!=='#'&&!isExternalUrl;
  const btnLabel=isLocalFile?'Download Dataset':isGoogleUrl?'Open in Google Docs':'Read online';
  const btnArrow=isLocalFile?'↓':'↗';
  const actionsHtml=gdocsUrl&&gdocsUrl!=='#'
    ?`<a class="btn-gdocs" href="${gdocsUrl}" target="_blank" rel="noopener"><span>${btnLabel}</span> <span>${btnArrow}</span></a>`
    :`<span style="font-family:var(--font-mono);font-size:11px;color:rgba(232,228,220,0.75);">No external link available for this item.</span>`;
  document.getElementById('modal-actions').innerHTML=actionsHtml;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
  (function(){const lbl=document.getElementById('modal-region-label');if(lbl)lbl.textContent='Region: '+(REGION_LABELS[REGIONS[doc.id]]||'All occupied territories');})();
}
function openViewer(url,title){
  document.getElementById('viewer-title').textContent=title;
  document.getElementById('viewer-iframe').src=url;
  document.getElementById('viewer-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeViewer(){
  document.getElementById('viewer-overlay').classList.remove('open');
  document.getElementById('viewer-iframe').src='';
  document.body.style.overflow='';
}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModalDirect();closeViewer();}});
