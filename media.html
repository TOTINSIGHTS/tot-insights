<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media &amp; Public Engagement - TOT Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="navigation.css?v=8">
<link rel="stylesheet" href="assets/css/main.css?v=8">
<style>

body{font-family:var(--font-sans);background:var(--cream-panel);color:#6b6b78;font-size:var(--fs-body);line-height:1.6;}

.media-section{padding:40px 40px 80px;background:transparent;}
.media-inner{max-width:1200px;margin:0 auto;}
.section-label{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:10px;}

.filter-block{margin-bottom:20px;}
/* Format + Year filter groups sit side by side across the page; they stack
   again on narrow screens where there isn't room for both. */
.filter-blocks{display:flex;flex-wrap:wrap;gap:20px 56px;margin-bottom:20px;}
.filter-blocks .filter-block{flex:1 1 280px;margin-bottom:0;}
@media(max-width:640px){.filter-blocks .filter-block{flex-basis:100%;}}
.filter-row-label{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:0.14em;text-transform:uppercase;color:#4a4a57;margin-bottom:8px;}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;}

.results-count{font-family:var(--font-mono);font-size:var(--fs-label);color:#4a4a57;margin-bottom:14px;letter-spacing:0.05em;}
.results-count span{color:rgba(181,146,58,0.80);font-weight:500;}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;}
@media(max-width:1000px){.media-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.media-grid{grid-template-columns:1fr;}}
.media-card{background:var(--card-bg);border:1px solid #e0e4ed;border-left:3px solid #c9a84c;border-radius:3px;padding:16px 18px 14px;display:flex;flex-direction:column;transition:all 0.2s ease;height:420px;overflow:hidden;}
.media-card:hover{box-shadow:none;transform:translateY(-2px);}
.media-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.media-fmt{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:0.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;white-space:nowrap;flex-shrink:0;}
.media-fmt-podcast{background:rgba(138,111,46,0.12);color:#7a5c0d;}
.media-fmt-video{background:rgba(26,79,110,0.12);color:#1A4F6E;}
.media-fmt-article{background:rgba(122,92,13,0.12);color:#7a5c0d;}
.media-fmt-blog{background:rgba(26,92,53,0.12);color:#1a6b3c;}
.media-fmt-report{background:rgba(58,58,74,0.10);color:#3a3a4a;}
.media-fmt-journal{background:rgba(74,48,128,0.12);color:#4A3080;}
.media-date{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--gold);letter-spacing:0.06em;white-space:nowrap;}
.media-title{font-family:var(--font-serif);font-size:var(--fs-body);font-weight:700;color:#1a1a2e;line-height:1.35;margin-bottom:5px;}
.media-outlet{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
.media-desc{font-size:var(--fs-label);color:#3a3a4a;line-height:1.6;flex:1;margin-bottom:12px;}
.media-card-footer{margin-top:auto;padding-top:9px;border-top:1px solid #e0e4ed;}
.media-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-size:var(--fs-label);font-weight:500;color:var(--gold);text-decoration:none;transition:color 0.12s;}
.media-link:hover{color:#1a1a2e;}
.media-link-arrow{transition:transform 0.12s;}
.media-link:hover .media-link-arrow{transform:translateX(3px);}
.media-no-results{display:none;grid-column:1/-1;padding:48px 0;text-align:center;color:#4a4a57;font-size:var(--fs-body);}
.media-no-results.visible{display:block;}
@media(max-width:700px){.media-section{padding:28px 20px 60px;}.page-hero{padding:24px 20px 20px;}}
</style>
</head>
<body>

<div id="site-header"></div>

<div class="page-hero centered">
  <div class="page-hero-inner">
    
    <h1 class="page-title">Media &amp; Public Engagement</h1>
  </div>
</div>

<section class="media-section">
  <div class="media-inner">
    <div class="section-label">All media and public engagement</div>
    <div class="filter-blocks">
    <div class="filter-block">
      <div class="filter-row-label">Format</div>
      <div class="filter-row">
        <button class="filter-btn active" data-mfilter="format" data-mvalue="all">All formats</button>
        <button class="filter-btn" data-mfilter="format" data-mvalue="Podcast">Podcast</button>
        <button class="filter-btn" data-mfilter="format" data-mvalue="Video">Video</button>
        <button class="filter-btn" data-mfilter="format" data-mvalue="Article">Article</button>
        <button class="filter-btn" data-mfilter="format" data-mvalue="Blog">Blog</button>
        <button class="filter-btn" data-mfilter="format" data-mvalue="Report">Report</button>
        <button class="filter-btn" data-mfilter="format" data-mvalue="Journal Article">Journal Article</button>
      </div>
    </div>
    <div class="filter-block">
      <div class="filter-row-label">Year</div>
      <div class="filter-row">
        <button class="filter-btn active" data-mfilter="year" data-mvalue="all">All years</button>
        <button class="filter-btn" data-mfilter="year" data-mvalue="2026">2026</button>
        <button class="filter-btn" data-mfilter="year" data-mvalue="2025">2025</button>
        <button class="filter-btn" data-mfilter="year" data-mvalue="2024">2024</button>
      </div>
    </div>
    </div>
    <div class="results-count"><span id="media-count-num">55</span> items</div>
    <div class="media-grid" id="media-grid">
      <div class="media-no-results" id="media-no-results">No items match the selected filters.</div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="data/documents.js?v=4"></script>
<script>
const MEDIA_DATA = DOCS.filter(function(d){return d.media;}).map(function(d){return {t:d.title,d:d.date,y:d.year,o:d.outlet,f:d.format,desc:d.desc,url:d.url};});

const MEDIA_FMT_CLASS={'Podcast':'media-fmt-podcast','Video':'media-fmt-video','Article':'media-fmt-article','Blog':'media-fmt-blog','Report':'media-fmt-report','Journal Article':'media-fmt-journal'};
let mediaFmtFilter='all',mediaYearFilter='all';

function renderMedia(){
  const grid=document.getElementById('media-grid');
  const noRes=document.getElementById('media-no-results');
  const filtered=MEDIA_DATA.filter(m=>(mediaFmtFilter==='all'||m.f===mediaFmtFilter)&&(mediaYearFilter==='all'||m.y===mediaYearFilter));
  document.getElementById('media-count-num').textContent=filtered.length;
  let cards='';
  filtered.forEach((m,i)=>{
    cards+=`<div class="media-card"><div class="media-card-top"><span class="media-fmt ${MEDIA_FMT_CLASS[m.f]||'media-fmt-report'}">${m.f}</span><span class="media-date">${m.d}</span></div><div class="media-title">${m.t}</div><div class="media-outlet">${m.o}</div><div class="media-desc">${m.desc}</div><div class="media-card-footer"><a class="media-link" href="${m.url}" target="_blank" rel="noopener">View <span class="media-link-arrow">&rarr;</span></a></div></div>`;
  });
  [...grid.children].forEach(c=>{if(c.id!=='media-no-results')c.remove();});
  grid.insertAdjacentHTML('afterbegin',cards);
  noRes.classList.toggle('visible',filtered.length===0);
}

document.querySelectorAll('[data-mfilter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.mfilter,v=btn.dataset.mvalue;
    document.querySelectorAll(`[data-mfilter="${f}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(f==='format')mediaFmtFilter=v;
    if(f==='year')mediaYearFilter=v;
    renderMedia();
  });
});

renderMedia();
</script>
<script src="navigation.js?v=12"></script>
</body>
</html>
